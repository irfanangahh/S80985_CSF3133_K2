<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Café Campus</title>

<!-- external css for navigation bar and new sections -->
<link rel="stylesheet" href="cafe.css">

<style>
/* link states, correct order */
a:link {color: #1A5276;}
a:visited {color: #7D3C98;}
a:hover {color: #E67E22;}
a:active {color: #C0392B;}
h1 {text-decoration: overline;}
p {color: #333333; text-align: justify;}
.intro {
    font-size: 18px;
    background-color: #FDEBD0;
}
.highlight {
    font-weight: bold;
    color: #C0392B;
}
</style>
</head>
<body>
<!--
Error 1 (Line 6): type="text/css" is not needed in the style tag
Error 2 (Line 7): HTML comment used inside the style, should be a CSS comment
Error 3 (Line 9): list-style-type: no should be none
Error 4 (Line 14-15): hover is written before visited, the order should be link, visited, hover, active
Error 5 (Line 17): overlined should be overline
Error 6 (Line 18): missing colon after color
Error 7 (Line 19): #intro should be .intro because the html uses class="intro"
Error 8 (Line 21): closing bracket } is missing for the intro rule
Error 9 (Line 22): highlight is missing the dot, should be .highlight
Error 10 (Line 34): href="menu" should be href="#menu"
Error 11 (Line 42 and 46): id="item" is used two times, id must be unique so I used class
Error 12 (Line 53): video has no controls
Error 13 (Line 54): source type="mp4" should be type="video/mp4"
-->

<header>
<h1>e-Café Campus</h1>
</header>

<!-- navigation bar -->
<nav>
<ul>
<li><a href="#menu">Menu</a></li>
<li><a href="#video">Video</a></li>
<li><a href="#feedback">Feedback</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<!-- menu section with old price and new price -->
<section id="menu">
<h2>Today's Menu</h2>
<p class="intro">Freshly brewed coffee and local delights every day.</p>
<article class="item">
<h3>Kopi Tarik</h3>
<p>Only <span class="old-price">RM 4.50</span> <span class="highlight">RM 3.50</span></p>
</article>
<article class="item">
<h3>Nasi Lemak</h3>
<p>Only <span class="old-price">RM 6.00</span> <span class="highlight">RM 5.00</span></p>
</article>
</section>

<!-- video section with caption -->
<section id="video">
<h2>Watch Our Story</h2>
<figure>
<video width="400" height="300" controls>
<source src="cafe.mp4" type="video/mp4">
Your browser does not support the video tag.
</video>
<figcaption>The story of our cafe</figcaption>
</figure>
</section>

<!-- feedback section -->
<section id="feedback">
<h2>Feedback</h2>
<form class="feedback-form">
<p>
<label for="name">Name:</label>
<input type="text" id="name" name="name">
</p>
<p>
<label for="email">E-mail:</label>
<input type="email" id="email" name="email">
</p>

<p>Visit type:</p>
<p>
<label><input type="radio" name="visit" value="dinein"> Dine-in</label>
<label><input type="radio" name="visit" value="takeaway"> Take-away</label>
</p>

<p>Favourite items:</p>
<p>
<label><input type="checkbox" name="fav" value="kopi"> Kopi Tarik</label>
<label><input type="checkbox" name="fav" value="nasilemak"> Nasi Lemak</label>
<label><input type="checkbox" name="fav" value="roti"> Roti Canai</label>
</p>

<p>
<input type="submit" value="Submit">
</p>
</form>
</section>

<!-- footer with address -->
<footer id="contact">
<p>&copy; 2026 e-Café Campus</p>
<address>
<a href="mailto:info@ecafecampus.com">info@ecafecampus.com</a>
</address>
</footer>

</body>
</html>
